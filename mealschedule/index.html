<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Schedule</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f3ec;
    color: #1c1915;
    /* 100vh on iOS Safari counts the toolbar area, so the page ends up
       taller than the visible screen and scrolls. 100dvh is the height
       actually visible, with 100vh kept as a fallback. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }
  .view {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .view[hidden] {
    display: none;
  }
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
  }
  .topbar h1 {
    flex: 1;
    text-align: center;
  }
  .topbar h1:first-child {
    text-align: left;
  }
  button {
    font: inherit;
  }
  .pill {
    flex-shrink: 0;
    background: #1c1915;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .text-button {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #1c1915;
    padding: 10px 4px;
    cursor: pointer;
  }
  .meals-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    list-style: none;
    padding-bottom: 8px;
  }
  .meals-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 18px;
  }
  .meal-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .slot-tags {
    font-size: 14px;
    color: #77716a;
  }
  .delete-button {
    background: none;
    border: none;
    color: #77716a;
    font-size: 22px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .checkboxes label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
    cursor: pointer;
  }
  .checkboxes input {
    width: auto;
    margin-bottom: 0;
    accent-color: #1c1915;
  }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #77716a;
    font-size: 18px;
    padding: 24px;
  }
  .empty[hidden] {
    display: none;
  }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal[hidden] {
    display: none;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
  }
  .sheet {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2 {
    font-size: 22px;
    margin-bottom: 16px;
  }
  .sheet label {
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .sheet input {
    width: 100%;
    font: inherit;
    font-size: 18px;
    border: 1px solid #ddd6c8;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .form-actions .secondary {
    background: #ffffff;
    color: #1c1915;
    border: 1px solid #ddd6c8;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .form-actions .primary {
    background: #1c1915;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  @media (min-width: 700px) {
    .modal {
      align-items: center;
      padding: 24px;
    }
    .sheet {
      border-radius: 20px;
      padding: 24px;
    }
  }
  .calendar {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 16px 12px;
    margin: 0 -16px 16px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .calendar::-webkit-scrollbar {
    display: none;
  }
  .day {
    flex: 0 0 auto;
    width: 74px;
    height: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 14px;
    color: #1c1915;
    cursor: pointer;
    scroll-snap-align: center;
  }
  .day .month,
  .day .weekday {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #77716a;
  }
  .day .number {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
  }
  .day .today-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }
  .day.is-today .today-dot {
    background: #1c1915;
  }
  .day.is-selected {
    background: #1c1915;
    border-color: #1c1915;
    color: #ffffff;
  }
  .day.is-selected .month,
  .day.is-selected .weekday {
    color: #d8d2c4;
  }
  .day.is-selected.is-today .today-dot {
    background: #ffffff;
  }
  .schedule {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 960px;
    margin: 0 auto;
  }
  .meal {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .meal h2 {
    font-size: 22px;
    margin-bottom: 12px;
  }
  .meal p {
    font-size: 18px;
    color: #55504a;
  }
  @media (min-width: 700px) {
    .schedule {
      flex-direction: row;
    }
    .meal {
      flex: 1;
    }
  }
</style>
</head>
<body>
  <section id="schedule-view" class="view">
    <header class="topbar">
      <h1>Meal Schedule</h1>
      <button type="button" id="go-meals" class="pill">Meals</button>
    </header>
    <nav class="calendar" id="calendar" aria-label="Calendar"></nav>
    <main class="schedule">
      <section class="meal">
        <h2>Breakfast</h2>
        <p id="breakfast-meal">Fast</p>
      </section>
      <section class="meal">
        <h2>Lunch</h2>
        <p id="lunch-meal">Fast</p>
      </section>
      <section class="meal">
        <h2>Dinner</h2>
        <p id="dinner-meal">Fast</p>
      </section>
    </main>
  </section>
  <section id="meals-view" class="view" hidden>
    <header class="topbar">
      <button type="button" id="back-schedule" class="text-button">&lsaquo; Schedule</button>
      <h1>Meals</h1>
      <button type="button" id="open-add" class="pill">+ Add</button>
    </header>
    <p id="meals-empty" class="empty">No meals yet. Tap + Add to add your first meal.</p>
    <ul id="meals-list" class="meals-list"></ul>
  </section>
  <div id="add-modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <h2 id="add-title">New meal</h2>
      <form id="add-form">
        <label for="meal-name">Meal name</label>
        <input id="meal-name" type="text" autocomplete="off" placeholder="e.g. Pasta">
        <div class="checkboxes">
          <label><input type="checkbox" id="slot-breakfast" checked> Breakfast</label>
          <label><input type="checkbox" id="slot-lunch" checked> Lunch</label>
          <label><input type="checkbox" id="slot-dinner" checked> Dinner</label>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-add" class="secondary">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const calendar = document.getElementById("calendar");
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let todayButton = null;

    for (let offset = -14; offset <= 14; offset++) {
      const date = new Date(today);
      date.setDate(today.getDate() + offset);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "day";
      button.setAttribute("aria-label", date.toDateString());
      button.innerHTML =
        '<span class="month">' + months[date.getMonth()] + "</span>" +
        '<span class="number">' + date.getDate() + "</span>" +
        '<span class="weekday">' + weekdays[date.getDay()] + "</span>" +
        '<span class="today-dot" aria-hidden="true"></span>';
      if (offset === 0) {
        button.classList.add("is-today", "is-selected");
        todayButton = button;
      }
      button.addEventListener("click", () => {
        document.querySelectorAll(".day.is-selected").forEach((el) => el.classList.remove("is-selected"));
        button.classList.add("is-selected");
        button.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      });
      calendar.appendChild(button);
    }

    if (todayButton) {
      todayButton.scrollIntoView({ inline: "center", block: "nearest" });
    }
  </script>
  <script>
    const scheduleView = document.getElementById("schedule-view");
    const mealsView = document.getElementById("meals-view");
    const mealsList = document.getElementById("meals-list");
    const mealsEmpty = document.getElementById("meals-empty");
    const addModal = document.getElementById("add-modal");
    const mealNameInput = document.getElementById("meal-name");
    const addForm = document.getElementById("add-form");
    const storageKey = "mealschedule.meals";

    const slots = ["breakfast", "lunch", "dinner"];
    const slotLabels = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner" };

    function newMealId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function loadMeals() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey));
        if (!Array.isArray(parsed)) return [];
        // Migrate meals saved before slots existed: a plain name becomes
        // a meal checked for every slot.
        return parsed
          .map((item) => {
            if (typeof item === "string") {
              return { id: newMealId(), name: item, breakfast: true, lunch: true, dinner: true };
            }
            if (item && typeof item.name === "string") {
              return {
                id: typeof item.id === "string" ? item.id : newMealId(),
                name: item.name,
                breakfast: item.breakfast !== false,
                lunch: item.lunch !== false,
                dinner: item.dinner !== false,
              };
            }
            return null;
          })
          .filter(Boolean);
      } catch (error) {
        return [];
      }
    }

    let meals = loadMeals();

    function saveMeals() {
      localStorage.setItem(storageKey, JSON.stringify(meals));
    }

    const historyKey = "mealschedule.history";

    function loadHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(historyKey));
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    let history = loadHistory();

    function saveHistory() {
      localStorage.setItem(historyKey, JSON.stringify(history));
    }

    function dateKey(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    function parseDateKey(text) {
      const parts = text.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function daysBetween(from, to) {
      const fromDay = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
      const toDay = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
      return Math.round((toDay - fromDay) / 86400000);
    }

    function poolFor(slot) {
      return meals.filter((meal) => meal[slot]);
    }

    function fastSchedule() {
      return { breakfast: "Fast", lunch: "Fast", dinner: "Fast" };
    }

    // Next day's schedule from the previous day's stored schedule, one
    // round-robin step per slot. A previous meal that is no longer in the
    // pool (deleted, or Fast) falls back to the first meal in the pool.
    // Cycles are independent per slot, so the same meal may repeat
    // within a day.
    function nextDaySchedule(prev) {
      const next = {};
      slots.forEach((slot) => {
        const pool = poolFor(slot);
        if (pool.length === 0) {
          next[slot] = "Fast";
          return;
        }
        const position = pool.findIndex((meal) => meal.name === prev[slot]);
        next[slot] = position === -1 ? pool[0].name : pool[(position + 1) % pool.length].name;
      });
      return next;
    }

    // Only the past is stored, by meal name, and never recomputed:
    // deleting a meal leaves its stored days untouched. Today is live:
    // adding, deleting, or re-checking a meal today changes today's
    // schedule immediately. A day is locked into history when it becomes
    // past. On load, backfill any skipped past days between the last
    // stored day and yesterday, so history stays continuous.
    function ensurePastLocked() {
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const todayText = dateKey(todayDate);
      let changed = false;
      // Today is live, never stored. Drop any today entry left by an
      // earlier version so today always recomputes.
      if (history[todayText]) {
        delete history[todayText];
        changed = true;
      }
      const storedDates = Object.keys(history).filter((date) => date < todayText).sort();
      if (storedDates.length === 0) {
        if (changed) saveHistory();
        return;
      }
      const lastText = storedDates[storedDates.length - 1];
      let prev = history[lastText];
      let current = parseDateKey(lastText);
      while (true) {
        current.setDate(current.getDate() + 1);
        const key = dateKey(current);
        if (key >= todayText) break;
        const next = nextDaySchedule(prev);
        history[key] = next;
        prev = next;
        changed = true;
      }
      if (changed) saveHistory();
    }

    function computeTodaySchedule() {
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const todayText = dateKey(todayDate);
      const storedDates = Object.keys(history).filter((date) => date < todayText).sort();
      if (storedDates.length === 0) {
        // No past to advance from: today is the first meal in each pool.
        const schedule = {};
        slots.forEach((slot) => {
          const pool = poolFor(slot);
          schedule[slot] = pool.length === 0 ? "Fast" : pool[0].name;
        });
        return schedule;
      }
      // Today is one round-robin step after the most recent past day
      // (yesterday, after backfilling), using the current pools.
      return nextDaySchedule(history[storedDates[storedDates.length - 1]]);
    }

    function scheduleFor(targetDate) {
      const targetText = dateKey(targetDate);
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const todayText = dateKey(todayDate);
      if (targetText < todayText) {
        return history[targetText] || fastSchedule();
      }
      const todaySchedule = computeTodaySchedule();
      if (targetText === todayText) return todaySchedule;
      // Future preview only: advance from today's live schedule using
      // the current pools. It is not stored, so it updates if meals
      // change, until that day becomes past and gets locked.
      let prev = todaySchedule;
      let next = prev;
      const delta = daysBetween(todayDate, targetDate);
      for (let i = 0; i < delta; i++) {
        next = nextDaySchedule(prev);
        prev = next;
      }
      return next;
    }

    let selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);

    function renderSchedule() {
      ensurePastLocked();
      const schedule = scheduleFor(selectedDate);
      slots.forEach((slot) => {
        document.getElementById(slot + "-meal").textContent = schedule[slot];
      });
    }

    function renderMeals(scrollToNew) {
      mealsList.innerHTML = "";
      mealsEmpty.hidden = meals.length > 0;
      meals.forEach((meal, index) => {
        const item = document.createElement("li");
        const info = document.createElement("div");
        info.className = "meal-info";
        const label = document.createElement("span");
        label.textContent = meal.name;
        const tags = document.createElement("span");
        tags.className = "slot-tags";
        tags.textContent = slots.filter((slot) => meal[slot]).map((slot) => slotLabels[slot]).join(" \u00b7 ") || "No slots";
        info.appendChild(label);
        info.appendChild(tags);
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.setAttribute("aria-label", "Delete " + meal.name);
        deleteButton.textContent = "\u00d7";
        deleteButton.addEventListener("click", () => {
          meals.splice(index, 1);
          saveMeals();
          renderMeals(false);
          renderSchedule();
        });
        item.appendChild(info);
        item.appendChild(deleteButton);
        mealsList.appendChild(item);
      });
      if (scrollToNew && mealsList.lastElementChild) {
        mealsList.lastElementChild.scrollIntoView({ block: "nearest" });
      }
    }

    function showView(view) {
      scheduleView.hidden = view !== "schedule";
      mealsView.hidden = view !== "meals";
    }

    function openModal() {
      mealNameInput.value = "";
      document.getElementById("slot-breakfast").checked = true;
      document.getElementById("slot-lunch").checked = true;
      document.getElementById("slot-dinner").checked = true;
      addModal.hidden = false;
      mealNameInput.focus();
    }

    function closeModal() {
      addModal.hidden = true;
    }

    document.getElementById("go-meals").addEventListener("click", () => showView("meals"));
    document.getElementById("back-schedule").addEventListener("click", () => showView("schedule"));
    document.getElementById("open-add").addEventListener("click", openModal);
    document.getElementById("cancel-add").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", closeModal);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !addModal.hidden) closeModal();
    });
    addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = mealNameInput.value.trim();
      if (!name) return;
      meals.push({
        id: newMealId(),
        name: name,
        breakfast: document.getElementById("slot-breakfast").checked,
        lunch: document.getElementById("slot-lunch").checked,
        dinner: document.getElementById("slot-dinner").checked,
      });
      saveMeals();
      renderMeals(true);
      renderSchedule();
      closeModal();
    });

    document.querySelectorAll(".day").forEach((dayButton) => {
      dayButton.addEventListener("click", () => {
        const parsed = new Date(dayButton.getAttribute("aria-label"));
        parsed.setHours(0, 0, 0, 0);
        selectedDate = parsed;
        renderSchedule();
      });
    });

    renderMeals(false);
    renderSchedule();
  </script>
</body>
</html>
