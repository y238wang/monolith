<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Schedule</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f3ec;
    color: #1c1915;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }
  .view {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .view[hidden] {
    display: none;
  }
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
  }
  .topbar h1 {
    flex: 1;
    text-align: center;
  }
  .topbar h1:first-child {
    text-align: left;
  }
  button {
    font: inherit;
  }
  .pill {
    flex-shrink: 0;
    background: #1c1915;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .text-button {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #1c1915;
    padding: 10px 4px;
    cursor: pointer;
  }
  .meals-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    list-style: none;
    padding-bottom: 8px;
  }
  .meals-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 18px;
  }
  .meal-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .slot-tags {
    font-size: 14px;
    color: #77716a;
  }
  .delete-button {
    background: none;
    border: none;
    color: #77716a;
    font-size: 22px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .checkboxes label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
    cursor: pointer;
  }
  .checkboxes input {
    width: auto;
    margin-bottom: 0;
    accent-color: #1c1915;
  }
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
    cursor: pointer;
  }
  .radio-group input {
    width: auto;
    margin-bottom: 0;
    accent-color: #1c1915;
  }
  .form-error {
    color: #b00020;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .form-error[hidden] {
    display: none;
  }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #77716a;
    font-size: 18px;
    padding: 24px;
  }
  .empty[hidden] {
    display: none;
  }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal[hidden] {
    display: none;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
  }
  .sheet {
    position: relative;
    width: 100%;
    max-width: 520px;
    max-height: 90dvh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2 {
    font-size: 22px;
    margin-bottom: 16px;
  }
  .sheet label {
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .sheet input {
    width: 100%;
    font: inherit;
    font-size: 18px;
    border: 1px solid #ddd6c8;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .form-actions .secondary {
    background: #ffffff;
    color: #1c1915;
    border: 1px solid #ddd6c8;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .form-actions .primary {
    background: #1c1915;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .edit-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .edit-option {
    text-align: left;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 18px;
  }
  @media (min-width: 700px) {
    .modal {
      align-items: center;
      padding: 24px;
    }
    .sheet {
      border-radius: 20px;
      padding: 24px;
    }
  }
  .calendar {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 16px 12px;
    margin: 0 -16px 16px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .calendar::-webkit-scrollbar {
    display: none;
  }
  .day {
    flex: 0 0 auto;
    width: 74px;
    height: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 14px;
    color: #1c1915;
    cursor: pointer;
    scroll-snap-align: center;
  }
  .day .month,
  .day .weekday {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #77716a;
  }
  .day .number {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
  }
  .day .today-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }
  .day.is-today .today-dot {
    background: #1c1915;
  }
  .day.is-selected {
    background: #1c1915;
    border-color: #1c1915;
    color: #ffffff;
  }
  .day.is-selected .month,
  .day.is-selected .weekday {
    color: #d8d2c4;
  }
  .day.is-selected.is-today .today-dot {
    background: #ffffff;
  }
  .schedule {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 960px;
    margin: 0 auto;
  }
  .meal {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .meal-breakfast {
    background: #fff7d1;
    border-color: #e6d489;
  }
  .meal-lunch {
    background: #e8f3e3;
    border-color: #b7d9ab;
  }
  .meal-dinner {
    background: #ece9f7;
    border-color: #c7bfe6;
  }
  .sort-row {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-button {
    background: #ffffff;
    border: 1px solid #ddd6c8;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .sort-button.is-active {
    background: #1c1915;
    border-color: #1c1915;
    color: #ffffff;
  }
  .meal-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .meal h2 {
    font-size: 22px;
    margin-bottom: 12px;
  }
  .meal-head h2 {
    margin-bottom: 0;
  }
  .edit-button {
    background: none;
    border: none;
    color: #77716a;
    font-size: 18px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
  }
  .edit-button[hidden] {
    display: none;
  }
  .meal p {
    font-size: 18px;
    color: #55504a;
  }
  .meal .meal-source {
    font-size: 13px;
    color: #77716a;
    margin-top: 8px;
  }
  @media (min-width: 700px) {
    .schedule {
      flex-direction: row;
    }
    .meal {
      flex: 1;
    }
  }
</style>
</head>
<body>
  <section id="schedule-view" class="view">
    <header class="topbar">
      <h1>Meal Schedule</h1>
      <button type="button" id="go-meals" class="pill">Meals</button>
    </header>
    <nav class="calendar" id="calendar" aria-label="Calendar"></nav>
    <main class="schedule">
      <section class="meal meal-breakfast">
        <div class="meal-head">
          <h2>Breakfast</h2>
          <button type="button" class="edit-button" id="edit-breakfast" aria-label="Edit breakfast">&#9998;</button>
        </div>
        <p id="breakfast-meal">Fast</p>
        <p class="meal-source" id="breakfast-source"></p>
      </section>
      <section class="meal meal-lunch">
        <div class="meal-head">
          <h2>Lunch</h2>
          <button type="button" class="edit-button" id="edit-lunch" aria-label="Edit lunch">&#9998;</button>
        </div>
        <p id="lunch-meal">Fast</p>
        <p class="meal-source" id="lunch-source"></p>
      </section>
      <section class="meal meal-dinner">
        <div class="meal-head">
          <h2>Dinner</h2>
          <button type="button" class="edit-button" id="edit-dinner" aria-label="Edit dinner">&#9998;</button>
        </div>
        <p id="dinner-meal">Fast</p>
        <p class="meal-source" id="dinner-source"></p>
      </section>
    </main>
  </section>
  <section id="meals-view" class="view" hidden>
    <header class="topbar">
      <button type="button" id="back-schedule" class="text-button">&lsaquo; Schedule</button>
      <h1>Meals</h1>
      <button type="button" id="open-add" class="pill">+ Add</button>
    </header>
    <div class="sort-row" role="group" aria-label="Sort meals">
      <button type="button" class="sort-button is-active" data-sort="added">Added</button>
      <button type="button" class="sort-button" data-sort="name">Name</button>
      <button type="button" class="sort-button" data-sort="slot">Slot</button>
      <button type="button" class="sort-button" data-sort="type">Type</button>
    </div>
    <p id="meals-empty" class="empty">No meals yet. Tap + Add to add your first meal.</p>
    <ul id="meals-list" class="meals-list"></ul>
  </section>
  <div id="add-modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <h2 id="add-title">New meal</h2>
      <form id="add-form">
        <label for="meal-name">Meal name</label>
        <input id="meal-name" type="text" autocomplete="off" placeholder="e.g. Pasta">
        <label>Slot</label>
        <div class="radio-group">
          <label><input type="radio" name="slot" value="breakfast" checked> Breakfast</label>
          <label><input type="radio" name="slot" value="lunch"> Lunch</label>
          <label><input type="radio" name="slot" value="dinner"> Dinner</label>
        </div>
        <label>Type</label>
        <div class="radio-group">
          <label><input type="radio" name="meal-type" value="default" checked> Default</label>
          <label><input type="radio" name="meal-type" value="recurring"> Recurring</label>
        </div>
        <div id="recurring-fields" hidden>
          <label for="rec-start">Start date</label>
          <input id="rec-start" type="date">
          <label for="rec-end">End date (leave blank for no end)</label>
          <input id="rec-end" type="date">
          <label>Frequency</label>
          <div class="radio-group">
            <label><input type="radio" name="freq-mode" value="weekdays" checked> Weekdays</label>
            <label><input type="radio" name="freq-mode" value="every"> Every X days</label>
          </div>
          <div id="freq-weekdays">
            <div class="checkboxes">
              <label><input type="checkbox" class="rec-weekday" value="1"> Mon</label>
              <label><input type="checkbox" class="rec-weekday" value="2"> Tue</label>
              <label><input type="checkbox" class="rec-weekday" value="3"> Wed</label>
              <label><input type="checkbox" class="rec-weekday" value="4"> Thu</label>
              <label><input type="checkbox" class="rec-weekday" value="5"> Fri</label>
              <label><input type="checkbox" class="rec-weekday" value="6"> Sat</label>
              <label><input type="checkbox" class="rec-weekday" value="0"> Sun</label>
            </div>
          </div>
          <div id="freq-every" hidden>
            <label for="rec-every">Every X days</label>
            <input id="rec-every" type="number" min="1" step="1" value="7">
          </div>
        </div>
        <p id="add-error" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="button" id="cancel-add" class="secondary">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>
  <div id="edit-modal" class="modal" hidden>
    <div class="modal-backdrop" id="edit-modal-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title">Edit meal</h2>
      <div id="edit-options" class="edit-options"></div>
      <div class="form-actions">
        <button type="button" id="clear-edit" class="secondary">Clear edit</button>
        <button type="button" id="cancel-edit" class="secondary">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const calendar = document.getElementById("calendar");
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let todayButton = null;

    for (let offset = -14; offset <= 14; offset++) {
      const date = new Date(today);
      date.setDate(today.getDate() + offset);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "day";
      button.setAttribute("aria-label", date.toDateString());
      button.innerHTML =
        '<span class="month">' + months[date.getMonth()] + "</span>" +
        '<span class="number">' + date.getDate() + "</span>" +
        '<span class="weekday">' + weekdays[date.getDay()] + "</span>" +
        '<span class="today-dot" aria-hidden="true"></span>';
      if (offset === 0) {
        button.classList.add("is-today", "is-selected");
        todayButton = button;
      }
      button.addEventListener("click", () => {
        document.querySelectorAll(".day.is-selected").forEach((el) => el.classList.remove("is-selected"));
        button.classList.add("is-selected");
        button.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      });
      calendar.appendChild(button);
    }

    if (todayButton) {
      todayButton.scrollIntoView({ inline: "center", block: "nearest" });
    }
  </script>
  <script>
    const scheduleView = document.getElementById("schedule-view");
    const mealsView = document.getElementById("meals-view");
    const mealsList = document.getElementById("meals-list");
    const mealsEmpty = document.getElementById("meals-empty");
    const addModal = document.getElementById("add-modal");
    const editModal = document.getElementById("edit-modal");
    const mealNameInput = document.getElementById("meal-name");
    const addForm = document.getElementById("add-form");
    const addError = document.getElementById("add-error");
    const recurringFields = document.getElementById("recurring-fields");
    const freqWeekdays = document.getElementById("freq-weekdays");
    const freqEvery = document.getElementById("freq-every");
    const storageKey = "mealschedule.meals";
    const historyKey = "mealschedule.history";
    const editsKey = "mealschedule.edits";

    const slots = ["breakfast", "lunch", "dinner"];
    const slotLabels = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner" };
    const weekdayShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    // Weekday checkboxes are shown Mon-Sun; their values are JS day numbers.
    const weekdayOrder = [1, 2, 3, 4, 5, 6, 0];

    function newMealId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function dateKey(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    function parseDateKey(text) {
      const parts = text.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function daysBetween(from, to) {
      const fromDay = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
      const toDay = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
      return Math.round((toDay - fromDay) / 86400000);
    }

    function isValidDateKey(text) {
      return typeof text === "string" && /^\d{4}-\d{2}-\d{2}$/.test(text) && !isNaN(parseDateKey(text).getTime());
    }

    function normalizeRecurring(raw) {
      if (!raw || typeof raw !== "object") return null;
      const start = isValidDateKey(raw.start) ? raw.start : null;
      if (!start) return null;
      const end = isValidDateKey(raw.end) ? raw.end : null;
      if (end && end < start) return null;
      if (raw.mode === "every") {
        const every = parseInt(raw.every, 10);
        if (!every || every < 1) return null;
        return { start: start, end: end, mode: "every", weekdays: [], every: every };
      }
      const days = Array.isArray(raw.weekdays) ? raw.weekdays.map(Number).filter((d) => d >= 0 && d <= 6) : [];
      return { start: start, end: end, mode: "weekdays", weekdays: days, every: 0 };
    }

    function loadMeals() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey));
        if (!Array.isArray(parsed)) return [];
        return parsed
          .map((item) => {
            if (typeof item === "string") {
              return { id: newMealId(), name: item, slot: "breakfast", type: "default" };
            }
            if (!item || typeof item.name !== "string") return null;
            // New model: a single slot toggle, and a type that is
            // either default or recurring, never both.
            if (typeof item.slot === "string" && slots.indexOf(item.slot) !== -1) {
              if (item.type === "recurring") {
                const rec = normalizeRecurring(item.recurring);
                if (rec) return { id: typeof item.id === "string" ? item.id : newMealId(), name: item.name, slot: item.slot, type: "recurring", recurring: rec };
              }
              return { id: typeof item.id === "string" ? item.id : newMealId(), name: item.name, slot: item.slot, type: "default" };
            }
            // Migration for the old multi-checkbox model (POC: keep the
            // first checked slot, Breakfast before Lunch before Dinner).
            let slot = "breakfast";
            if (item.breakfast === true) slot = "breakfast";
            else if (item.lunch === true) slot = "lunch";
            else if (item.dinner === true) slot = "dinner";
            return { id: typeof item.id === "string" ? item.id : newMealId(), name: item.name, slot: slot, type: "default" };
          })
          .filter(Boolean);
      } catch (error) {
        return [];
      }
    }

    let meals = loadMeals();

    function saveMeals() {
      localStorage.setItem(storageKey, JSON.stringify(meals));
    }

    function loadHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(historyKey));
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    let history = loadHistory();

    function saveHistory() {
      localStorage.setItem(historyKey, JSON.stringify(history));
    }

    function loadEdits() {
      try {
        const parsed = JSON.parse(localStorage.getItem(editsKey));
        if (!parsed || typeof parsed !== "object") return {};
        const cleaned = {};
        Object.keys(parsed).forEach((date) => {
          if (!isValidDateKey(date)) return;
          const day = parsed[date];
          if (!day || typeof day !== "object") return;
          slots.forEach((slot) => {
            if (typeof day[slot] === "string" && day[slot]) {
              if (!cleaned[date]) cleaned[date] = {};
              cleaned[date][slot] = day[slot];
            }
          });
        });
        return cleaned;
      } catch (error) {
        return {};
      }
    }

    let edits = loadEdits();

    function saveEdits() {
      localStorage.setItem(editsKey, JSON.stringify(edits));
    }

    function mealById(id) {
      return meals.find((meal) => meal.id === id) || null;
    }

    function mealByNameForSlot(name, slot) {
      return meals.find((meal) => meal.name === name && meal.slot === slot) || null;
    }

    function defaultPool(slot) {
      return meals.filter((meal) => meal.type === "default" && meal.slot === slot);
    }

    function recurringPool(slot) {
      return meals.filter((meal) => meal.type === "recurring" && meal.slot === slot);
    }

    function isRecurringOn(meal, dateObj, dateText) {
      const rec = meal.recurring;
      if (!rec) return false;
      if (dateText < rec.start) return false;
      if (rec.end && dateText > rec.end) return false;
      if (rec.mode === "every") {
        return daysBetween(parseDateKey(rec.start), dateObj) % rec.every === 0;
      }
      return rec.weekdays.indexOf(dateObj.getDay()) !== -1;
    }

    function pickRecurringWinner(candidates, lastScheduled) {
      // Never scheduled first, earliest created first (candidates are
      // already in creation order, so the first never-scheduled wins).
      const never = candidates.filter((meal) => !lastScheduled[meal.id]);
      if (never.length > 0) return never[0];
      // Otherwise the meal whose last scheduled date is furthest back.
      // No tie is possible here for meals scheduled at least once for
      // this slot, since only one meal serves a slot on a given day.
      let winner = candidates[0];
      candidates.forEach((meal) => {
        if (lastScheduled[meal.id] < lastScheduled[winner.id]) winner = meal;
      });
      return winner;
    }

    // Scheduling engine, three layers per slot per day, in order:
    // 1. edit for that day and slot (highest, stored separately)
    // 2. recurring meals falling on that date (conflicts: least
    //    recently scheduled previously, never-scheduled breaks on
    //    earliest created)
    // 3. default meals on rotation
    // Edit and recurring days do not consume a default rotation step:
    // the default pointer only advances on days actually served by
    // a default meal. A recurring meal served via an edit does count
    // as its last scheduled date, since it was scheduled that day.
    function daySchedule(dateObj, dateText, state) {
      const result = {};
      const source = {};
      const dayEdits = edits[dateText] || {};
      slots.forEach((slot) => {
        const edit = dayEdits[slot];
        if (edit !== undefined) {
          if (edit === "FAST") {
            result[slot] = "Fast";
            source[slot] = "Edited";
            return;
          }
          const editedMeal = mealById(edit);
          if (editedMeal) {
            result[slot] = editedMeal.name;
            source[slot] = "Edited";
            if (editedMeal.type === "recurring") state.lastScheduled[editedMeal.id] = dateText;
            return;
          }
          // Edit target was deleted without cleanup: fall through to
          // the next layers instead of showing a stale meal.
        }
        const candidates = recurringPool(slot).filter((meal) => isRecurringOn(meal, dateObj, dateText));
        if (candidates.length > 0) {
          const winner = pickRecurringWinner(candidates, state.lastScheduled);
          result[slot] = winner.name;
          source[slot] = "Recurring";
          state.lastScheduled[winner.id] = dateText;
          return;
        }
        const pool = defaultPool(slot);
        if (pool.length === 0) {
          result[slot] = "Fast";
          source[slot] = "Default";
          return;
        }
        const position = pool.findIndex((meal) => meal.name === state.lastDefault[slot]);
        const chosen = position === -1 ? pool[0] : pool[(position + 1) % pool.length];
        result[slot] = chosen.name;
        source[slot] = "Default";
        state.lastDefault[slot] = chosen.name;
      });
      return { schedule: result, source: source };
    }

    function initialStateFromHistory() {
      const state = { lastDefault: { breakfast: null, lunch: null, dinner: null }, lastScheduled: {} };
      Object.keys(history).sort().forEach((dateText) => {
        const day = history[dateText];
        if (!day) return;
        slots.forEach((slot) => {
          const name = day[slot];
          if (!name || name === "Fast") return;
          const meal = mealByNameForSlot(name, slot);
          if (!meal) return;
          if (meal.type === "recurring") state.lastScheduled[meal.id] = dateText;
          if (meal.type === "default") state.lastDefault[slot] = name;
        });
      });
      return state;
    }

    // Compute, in chronological order, every day from the day after the
    // most recent stored past day (or today, if there is no past) up
    // to the target date. Future days are previews only and are not
    // persisted; past days are persisted by ensurePastLocked instead.
    function computeUpTo(targetDate) {
      const state = initialStateFromHistory();
      const storedDates = Object.keys(history).sort();
      let current;
      if (storedDates.length === 0) {
        current = new Date();
        current.setHours(0, 0, 0, 0);
      } else {
        current = parseDateKey(storedDates[storedDates.length - 1]);
        current.setDate(current.getDate() + 1);
      }
      const schedules = {};
      const sources = {};
      while (current <= targetDate) {
        const key = dateKey(current);
        const day = daySchedule(current, key, state);
        schedules[key] = day.schedule;
        sources[key] = day.source;
        current.setDate(current.getDate() + 1);
      }
      return { schedules: schedules, sources: sources };
    }

    // Only the past is stored, by meal name, and never recomputed:
    // deleting a meal leaves its stored days untouched. Today is live.
    // A day is locked into history when it becomes past. On load,
    // backfill any skipped past days between the last stored day and
    // yesterday, so history stays continuous.
    function ensurePastLocked() {
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const todayText = dateKey(todayDate);
      let changed = false;
      if (history[todayText]) {
        delete history[todayText];
        changed = true;
      }
      const storedDates = Object.keys(history).filter((date) => date < todayText).sort();
      if (storedDates.length === 0) {
        if (changed) saveHistory();
        return;
      }
      const state = initialStateFromHistory();
      let current = parseDateKey(storedDates[storedDates.length - 1]);
      current.setDate(current.getDate() + 1);
      while (dateKey(current) < todayText) {
        const key = dateKey(current);
        const day = daySchedule(current, key, state);
        history[key] = day.schedule;
        changed = true;
        current.setDate(current.getDate() + 1);
      }
      if (changed) saveHistory();
    }

    function scheduleFor(targetDate) {
      const targetText = dateKey(targetDate);
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const todayText = dateKey(todayDate);
      if (targetText < todayText) {
        return { schedule: history[targetText] || { breakfast: "Fast", lunch: "Fast", dinner: "Fast" }, source: { breakfast: "Past", lunch: "Past", dinner: "Past" } };
      }
      const computed = computeUpTo(targetDate);
      return { schedule: computed.schedules[targetText], source: computed.sources[targetText] };
    }

    let selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);

    function renderSchedule() {
      ensurePastLocked();
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      const isPast = dateKey(selectedDate) < dateKey(todayDate);
      const info = scheduleFor(selectedDate);
      slots.forEach((slot) => {
        document.getElementById(slot + "-meal").textContent = info.schedule[slot];
        document.getElementById(slot + "-source").textContent = info.source[slot];
        document.getElementById("edit-" + slot).hidden = isPast;
      });
    }

    function recurringSummary(meal) {
      const rec = meal.recurring;
      if (!rec) return "Recurring";
      let freq = "";
      if (rec.mode === "every") {
        freq = "Every " + rec.every + (rec.every === 1 ? " day" : " days");
      } else {
        const names = weekdayOrder.filter((d) => rec.weekdays.indexOf(d) !== -1).map((d) => weekdayShort[d]);
        freq = "Every " + (names.length > 0 ? names.join(", ") : "weekday");
      }
      return "Recurring \u00b7 " + freq + " \u00b7 " + rec.start + (rec.end ? " to " + rec.end : "");
    }

    function futureEditsForMeal(mealId) {
      const todayText = dateKey(new Date());
      const dates = [];
      Object.keys(edits).sort().forEach((dateText) => {
        if (dateText < todayText) return;
        slots.forEach((slot) => {
          if (edits[dateText] && edits[dateText][slot] === mealId) dates.push(dateText + " " + slotLabels[slot]);
        });
      });
      return dates;
    }

    let mealSort = "added";

    function sortedMeals() {
      const withIndex = meals.map((meal, index) => ({ meal: meal, index: index }));
      if (mealSort === "name") {
        withIndex.sort((a, b) => {
          const an = a.meal.name.toLowerCase();
          const bn = b.meal.name.toLowerCase();
          if (an < bn) return -1;
          if (an > bn) return 1;
          return a.index - b.index;
        });
      } else if (mealSort === "slot") {
        const order = { breakfast: 0, lunch: 1, dinner: 2 };
        withIndex.sort((a, b) => (order[a.meal.slot] - order[b.meal.slot]) || (a.index - b.index));
      } else if (mealSort === "type") {
        const order = { default: 0, recurring: 1 };
        withIndex.sort((a, b) => (order[a.meal.type] - order[b.meal.type]) || (a.index - b.index));
      }
      return withIndex.map((entry) => entry.meal);
    }

    function renderMeals(scrollToNew, newMealId) {
      mealsList.innerHTML = "";
      mealsEmpty.hidden = meals.length > 0;
      sortedMeals().forEach((meal) => {
        const item = document.createElement("li");
        item.setAttribute("data-meal-id", meal.id);
        const info = document.createElement("div");
        info.className = "meal-info";
        const label = document.createElement("span");
        label.textContent = meal.name;
        const tags = document.createElement("span");
        tags.className = "slot-tags";
        tags.textContent = slotLabels[meal.slot] + " \u00b7 " + (meal.type === "recurring" ? recurringSummary(meal) : "Default");
        info.appendChild(label);
        info.appendChild(tags);
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.setAttribute("aria-label", "Delete " + meal.name);
        deleteButton.textContent = "\u00d7";
        deleteButton.addEventListener("click", () => {
          const affected = futureEditsForMeal(meal.id);
          if (affected.length > 0) {
            const ok = window.confirm("Deleting " + meal.name + " will remove edits on:\n" + affected.join("\n") + "\n\nContinue?");
            if (!ok) return;
            Object.keys(edits).forEach((dateText) => {
              slots.forEach((slot) => {
                if (edits[dateText] && edits[dateText][slot] === meal.id) delete edits[dateText][slot];
              });
              if (edits[dateText] && Object.keys(edits[dateText]).length === 0) delete edits[dateText];
            });
            saveEdits();
          }
          const at = meals.findIndex((m) => m.id === meal.id);
          if (at !== -1) meals.splice(at, 1);
          saveMeals();
          renderMeals(false);
          renderSchedule();
        });
        item.appendChild(info);
        item.appendChild(deleteButton);
        mealsList.appendChild(item);
      });
      if (scrollToNew) {
        let target = null;
        if (newMealId && mealsList.querySelector) {
          target = mealsList.querySelector('[data-meal-id="' + newMealId + '"]');
        }
        if (!target) target = mealsList.lastElementChild;
        if (target) target.scrollIntoView({ block: "nearest" });
      }
    }

    function showView(view) {
      scheduleView.hidden = view !== "schedule";
      mealsView.hidden = view !== "meals";
    }

    function checkedRadio(name) {
      const el = document.querySelector('input[name="' + name + '"]:checked');
      return el ? el.value : null;
    }

    function syncRecurringVisibility() {
      const isRecurring = checkedRadio("meal-type") === "recurring";
      recurringFields.hidden = !isRecurring;
      const mode = checkedRadio("freq-mode");
      freqWeekdays.hidden = mode !== "weekdays";
      freqEvery.hidden = mode !== "every";
    }

    function showAddError(message) {
      addError.textContent = message;
      addError.hidden = false;
    }

    function openModal() {
      mealNameInput.value = "";
      addError.hidden = true;
      document.querySelector('input[name="slot"][value="breakfast"]').checked = true;
      document.querySelector('input[name="meal-type"][value="default"]').checked = true;
      document.querySelector('input[name="freq-mode"][value="weekdays"]').checked = true;
      document.getElementById("rec-start").value = dateKey(new Date());
      document.getElementById("rec-end").value = "";
      document.querySelectorAll(".rec-weekday").forEach((el) => { el.checked = false; });
      document.getElementById("rec-every").value = "7";
      syncRecurringVisibility();
      addModal.hidden = false;
      mealNameInput.focus();
    }

    function closeModal() {
      addModal.hidden = true;
    }

    let editSlot = null;

    function openEdit(slot) {
      const todayDate = new Date();
      todayDate.setHours(0, 0, 0, 0);
      if (selectedDate < todayDate) return;
      editSlot = slot;
      const dateText = dateKey(selectedDate);
      document.getElementById("edit-title").textContent = "Edit " + slotLabels[slot] + " \u00b7 " + selectedDate.toDateString();
      const options = document.getElementById("edit-options");
      options.innerHTML = "";
      const fastButton = document.createElement("button");
      fastButton.type = "button";
      fastButton.className = "edit-option";
      fastButton.textContent = "Fast";
      fastButton.addEventListener("click", () => saveEdit("FAST"));
      options.appendChild(fastButton);
      meals.filter((meal) => meal.slot === slot).forEach((meal) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "edit-option";
        button.textContent = meal.name + (meal.type === "recurring" ? " \u00b7 Recurring" : "");
        button.addEventListener("click", () => saveEdit(meal.id));
        options.appendChild(button);
      });
      document.getElementById("clear-edit").hidden = !(edits[dateText] && edits[dateText][slot]);
      editModal.hidden = false;
    }

    function saveEdit(value) {
      if (!editSlot) return;
      const dateText = dateKey(selectedDate);
      if (!edits[dateText]) edits[dateText] = {};
      edits[dateText][editSlot] = value;
      saveEdits();
      editModal.hidden = true;
      renderSchedule();
    }

    function closeEdit() {
      editModal.hidden = true;
    }

    document.querySelectorAll(".sort-button").forEach((button) => {
      button.addEventListener("click", () => {
        mealSort = button.getAttribute("data-sort");
        document.querySelectorAll(".sort-button").forEach((el) => el.classList.remove("is-active"));
        button.classList.add("is-active");
        renderMeals(false);
      });
    });
    document.getElementById("go-meals").addEventListener("click", () => showView("meals"));
    document.getElementById("back-schedule").addEventListener("click", () => showView("schedule"));
    document.getElementById("open-add").addEventListener("click", openModal);
    document.getElementById("cancel-add").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", closeModal);
    document.getElementById("cancel-edit").addEventListener("click", closeEdit);
    document.getElementById("edit-modal-backdrop").addEventListener("click", closeEdit);
    document.getElementById("clear-edit").addEventListener("click", () => {
      if (!editSlot) return;
      const dateText = dateKey(selectedDate);
      if (edits[dateText]) {
        delete edits[dateText][editSlot];
        if (Object.keys(edits[dateText]).length === 0) delete edits[dateText];
        saveEdits();
      }
      closeEdit();
      renderSchedule();
    });
    document.querySelectorAll('input[name="meal-type"]').forEach((el) => el.addEventListener("change", syncRecurringVisibility));
    document.querySelectorAll('input[name="freq-mode"]').forEach((el) => el.addEventListener("change", syncRecurringVisibility));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (!addModal.hidden) closeModal();
        if (!editModal.hidden) closeEdit();
      }
    });
    addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addError.hidden = true;
      const name = mealNameInput.value.trim();
      if (!name) return;
      const slot = checkedRadio("slot");
      const type = checkedRadio("meal-type");
      if (!slot || !type) return;
      let recurring = null;
      if (type === "recurring") {
        const start = document.getElementById("rec-start").value;
        const end = document.getElementById("rec-end").value;
        if (!isValidDateKey(start)) {
          showAddError("Pick a start date for a recurring meal.");
          return;
        }
        if (end && (!isValidDateKey(end) || end < start)) {
          showAddError("End date must be on or after the start date.");
          return;
        }
        const mode = checkedRadio("freq-mode");
        if (mode === "weekdays") {
          const days = [];
          document.querySelectorAll(".rec-weekday:checked").forEach((el) => days.push(parseInt(el.value, 10)));
          if (days.length === 0) {
            showAddError("Check at least one weekday for a weekday recurring meal.");
            return;
          }
          recurring = { start: start, end: end || null, mode: "weekdays", weekdays: days, every: 0 };
        } else if (mode === "every") {
          const every = parseInt(document.getElementById("rec-every").value, 10);
          if (!every || every < 1) {
            showAddError("Every X days needs a number of 1 or more.");
            return;
          }
          recurring = { start: start, end: end || null, mode: "every", weekdays: [], every: every };
        } else {
          return;
        }
      }
      const meal = { id: newMealId(), name: name, slot: slot, type: type };
      if (recurring) meal.recurring = recurring;
      meals.push(meal);
      saveMeals();
      renderMeals(true, meal.id);
      renderSchedule();
      closeModal();
    });

    slots.forEach((slot) => {
      document.getElementById("edit-" + slot).addEventListener("click", () => openEdit(slot));
    });

    document.querySelectorAll(".day").forEach((dayButton) => {
      dayButton.addEventListener("click", () => {
        const parsed = new Date(dayButton.getAttribute("aria-label"));
        parsed.setHours(0, 0, 0, 0);
        selectedDate = parsed;
        renderSchedule();
      });
    });

    renderMeals(false);
    renderSchedule();
  </script>
</body>
</html>
