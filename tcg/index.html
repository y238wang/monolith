<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TCG Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0.75rem;
    -webkit-touch-callout: none;
  }
  .zone-label { font-size: 0.8rem; opacity: 0.6; margin-bottom: 0.4rem; }

  /* ---- middle: board + side panel ---- */
  #middle { display: flex; gap: 8px; flex: 1; min-height: 0; }
  #board { flex: 1; display: flex; gap: 8px; min-width: 0; }
  #side-panel {
    width: 92px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
  }

  /* ---- ministries as columns ---- */
  .column {
    flex: 1;
    min-width: 0;
    border-radius: 10px;
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
  }
  .column.min-red { background: rgba(233, 69, 96, 0.10); }
  .column.min-yellow { background: rgba(212, 160, 23, 0.10); }
  .column.min-blue { background: rgba(74, 123, 255, 0.10); }
  .column.drop-ok { outline: 2px solid #4caf50; }
  .column.drop-full { outline: 2px solid #e94560; }
  .col-slots {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    justify-content: flex-start;
    flex: 0 0 auto;
  }
  .slot {
    width: 46px;
    height: 64px;
    border-radius: 7px;
    border: 2px dashed #444;
    flex: 0 0 auto;
    position: relative;
  }
  .slot.filled { border-color: transparent; }
  .slot-badge {
    position: absolute;
    top: -7px; right: -7px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #2a2a40;
    border: 1px solid #666;
    font-size: 11px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.35;
    z-index: 2;
    pointer-events: none;
  }
  .slot-badge.on {
    opacity: 1;
    border-color: #ffd75e;
    box-shadow: 0 0 6px rgba(255, 215, 94, 0.7);
  }
  .slot-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #777;
    pointer-events: none;
  }
  .col-head {
    margin: auto 0;
    text-align: center;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 2px;
    border-top: 2px solid #555;
    border-bottom: 2px solid #555;
    opacity: 0.9;
  }
  .col-head.lead-you { border-top-color: #4caf50; border-bottom-color: #4caf50; }
  .col-head.lead-opp { border-top-color: #e94560; border-bottom-color: #e94560; }
  .col-head .tally { display: block; font-size: 0.8rem; margin-top: 2px; text-transform: none; letter-spacing: 0; }
  .col-head .tally b.you { color: #8fd694; }
  .col-head .tally b.opp { color: #f0a0a0; }

  /* ---- cards ---- */
  .card {
    border-radius: 7px;
    border: 2px solid #888;
    flex: 0 0 auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .card .cname {
    position: absolute; top: 2px; left: 0; right: 0;
    text-align: center; font-weight: 700;
    padding: 0 2px; white-space: nowrap; overflow: hidden;
  }
  .card .cost {
    position: absolute; left: 3px;
    border-radius: 50%;
    background: #d4a017; color: #fff;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .card .power {
    position: absolute; bottom: 1px; left: 0; right: 0;
    text-align: center; font-weight: 800;
  }
  /* hand cards (large) */
  .hand .card { width: 56px; height: 78px; font-size: 9px; }
  .hand .card .cname { font-size: 7px; }
  .hand .card .cost { top: 13px; width: 18px; height: 18px; font-size: 11px; }
  .hand .card .power { font-size: 20px; }
  .card.face-up { background: #f0e6d2; color: #222; cursor: grab; }
  .card.face-up.cant-afford { opacity: 0.35; cursor: default; }
  .card.face-up.min-red { background: #f8d7da; border-color: #e94560; }
  .card.face-up.min-yellow { background: #fff3cd; border-color: #d4a017; }
  .card.face-up.min-blue { background: #cfe2ff; border-color: #4a7bff; }
  /* column cards (compact, overlapping) */
  .slot .card { width: 100%; height: 100%; }
  .slot .card .cname { font-size: 6px; }
  .slot .card .cost { top: 11px; width: 15px; height: 15px; font-size: 9px; left: 3px; }
  .slot .card .power { font-size: 16px; }
  .slot .card.face-up { cursor: default; }
  .slot .card.opp { background: #3a3a5e; border-color: #555; cursor: default; }
  .slot .card.opp .power { color: #bbb; }
  /* drag ghost: explicit sizing, since it's detached from .hand */
  .card.drag-ghost {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    opacity: 0.92;
    transform: translate(-50%, -50%) scale(1.08);
    margin: 0;
    width: 56px;
    height: 78px;
    color: #222;
  }
  .card.drag-ghost .cname { font-size: 7px; }
  .card.drag-ghost .cost { top: 13px; width: 18px; height: 18px; font-size: 11px; }
  .card.drag-ghost .power { font-size: 20px; }

  .hand {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 84px;
    align-content: flex-start;
  }
  #opp-hand-strip { display: flex; gap: 4px; margin-bottom: 0.5rem; }
  #opp-hand-strip .card { width: 30px; height: 42px; border-radius: 5px; background: #3a3a5e; border-color: #555; }

  #turn-counter { font-size: 1.05rem; font-weight: 700; }
  #coins { font-size: 0.95rem; font-weight: 600; color: #ffd75e; }
  #wealth { font-size: 0.95rem; font-weight: 600; color: #9fd6a4; }
  #opp-stats { font-size: 0.72rem; opacity: 0.7; display: flex; flex-direction: column; gap: 0.15rem; }
  #opp-stats .opp-label { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.58rem; opacity: 0.8; }
  #opp-wealth { font-weight: 600; color: #9fd6a4; }
  #opp-coins { font-weight: 600; color: #ffd75e; }
  #end-turn {
    font-size: 0.95rem;
    font-weight: 700;
    width: 100%;
    padding: 0.8rem 0.3rem;
    border: none;
    border-radius: 14px;
    background: #e94560;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #end-turn:active { transform: scale(0.97); }
  #player-zone { margin-top: 0.75rem; }

  #result-banner {
    position: fixed; inset: 0;
    background: rgba(10, 10, 20, 0.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.9rem; z-index: 2000;
    padding: 2rem;
    text-align: center;
  }
  #result-banner.hidden { display: none; }
  #result-title { font-size: 2.5rem; font-weight: 800; }
  #result-title.win { color: #8fd694; }
  #result-title.lose { color: #f0a0a0; }
  #result-title.draw { color: #ccc; }
  #result-sub { font-size: 1rem; width: 100%; max-width: 300px; }
  #result-sub .mrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.4rem 0.2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  #result-sub .mrow b.you { color: #8fd694; }
  #result-sub .mrow b.opp { color: #f0a0a0; }
  #result-sub .mrow .mark { width: 1.5em; text-align: right; font-weight: 800; }
  #result-sub .mrow .mark.you { color: #8fd694; }
  #result-sub .mrow .mark.opp { color: #f0a0a0; }
  #result-sub .mrow .mark.tie { color: #888; }
  #result-sub .tnote { font-size: 0.8rem; opacity: 0.6; margin-top: 0.6rem; }
  #new-game {
    font-size: 1.2rem;
    font-weight: 700;
    padding: 0.9rem 2.5rem;
    border: none;
    border-radius: 999px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
    margin-top: 0.5rem;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #new-game:active { transform: scale(0.97); }
  #discard-slot {
    width: 68px;
    border: 2px dashed #666;
    border-radius: 10px;
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.9;
    margin-top: 0.5rem;
  }
  #discard-slot b { color: #ffd75e; font-size: 0.8rem; }
  #discard-slot.drop-ok { border-color: #4caf50; border-style: solid; background: rgba(76, 175, 80, 0.12); }
  #discard-slot.used { opacity: 0.3; }
  #toast {
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 35, 0.95);
    border: 1px solid #ffd75e;
    color: #ffd75e;
    font-size: 0.85rem; font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    z-index: 3000;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.hidden { display: none; }
</style>
</head>
<body oncontextmenu="return false">
  <section id="opp-zone">
    <div class="zone-label">Opponent &middot; <span id="opp-deck-count"></span></div>
    <div id="opp-hand-strip"></div>
  </section>

  <section id="middle">
    <div id="board"></div>
    <div id="side-panel">
      <div id="opp-stats">
        <span class="opp-label">opponent</span>
        <p id="opp-wealth"></p>
        <p id="opp-coins"></p>
      </div>
      <p id="turn-counter">Turn 1 of 6</p>
      <p id="wealth"></p>
      <p id="coins"></p>
      <button id="end-turn" type="button">End Turn</button>
      <div id="discard-slot"><span>discard</span><b>+1 coin</b></div>
    </div>
  </section>

  <section id="player-zone">
    <div class="zone-label">Your hand &middot; <span id="player-deck-count"></span></div>
    <div class="hand" id="player-hand"></div>
  </section>

  <div id="toast" class="hidden"></div>

  <div id="result-banner" class="hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button id="new-game" type="button">New Game</button>
  </div>

<script>
  (function () {
    var MAX_TURNS = 6;
    var STARTING_HAND = 4;
    var MINISTRIES = [
      { name: 'Militia',  color: 'red' },
      { name: 'Commerce', color: 'yellow' },
      { name: 'Intrigue', color: 'blue' }
    ];
    var MAX_PER_MINISTRY = 3;
    var BONUS_BADGE = ['\u2694\uFE0F', '\uD83E\uDE99', '\uD83C\uDC0F']; // militia / commerce / intrigue
    var SLOT_HINT = ['+tax', '+wealth', '+draw'];
    var BONUS_MSG = [
      'Militia bonus: tax +1 going forward',
      'Commerce bonus: +1 wealth each turn',
      'Intrigue bonus: draw +1 card each turn'
    ];

    var STARTER = [
      { name: 'Villager',        cost: 1, power: 2,  count: 2, ministry: null },
      { name: 'Artisan',         cost: 2, power: 4,  count: 2, ministry: null },
      { name: 'Scholar',         cost: 3, power: 6,  count: 2, ministry: null },
      { name: 'Elder',           cost: 4, power: 9,  count: 1, ministry: null },
      { name: 'Master',           cost: 5, power: 11, count: 1, ministry: null },
      { name: 'Sage',             cost: 6, power: 14, count: 1, ministry: null },
      { name: 'Militia Recruit',  cost: 2, power: 6,  count: 1, ministry: 0 },
      { name: 'Militia Captain',  cost: 4, power: 12, count: 1, ministry: 0 },
      { name: 'Peddler',          cost: 2, power: 6,  count: 1, ministry: 1 },
      { name: 'Merchant Prince',  cost: 4, power: 12, count: 1, ministry: 1 },
      { name: 'Informant',        cost: 2, power: 6,  count: 1, ministry: 2 },
      { name: 'Spymaster',        cost: 4, power: 12, count: 1, ministry: 2 }
    ];

    var turn, gameOver, playerWealth, playerCoins, oppWealth, oppCoins, discardUsed;
    var playerDeck, playerHand, oppDeck, oppHand;
    var playerBoard, oppBoard; // [ministry] -> array of cards (max 3)
    var nextId = 1;

    function buildDeck() {
      var d = [];
      STARTER.forEach(function (t) {
        for (var i = 0; i < t.count; i++) {
          d.push({ id: nextId++, name: t.name, cost: t.cost, power: t.power, ministry: t.ministry });
        }
      });
      for (var j = d.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = d[j]; d[j] = d[k]; d[k] = tmp;
      }
      return d;
    }

    function draw(deck, hand) {
      if (deck.length > 0) hand.push(deck.pop());
    }

    function ministryPower(board, m) {
      var t = 0;
      board[m].forEach(function (c) { t += c.power; });
      return t;
    }

    function colorClass(card) {
      if (card.ministry === null || card.ministry === undefined) return '';
      return ' min-' + MINISTRIES[card.ministry].color;
    }

    function cardEl(card, cls) {
      var c = document.createElement('div');
      c.className = 'card ' + cls + colorClass(card);
      c.dataset.cardId = card.id;
      var name = document.createElement('div');
      name.className = 'cname';
      name.textContent = card.name;
      var cost = document.createElement('div');
      cost.className = 'cost';
      cost.textContent = card.cost;
      var power = document.createElement('div');
      power.className = 'power';
      power.textContent = card.power;
      c.appendChild(name);
      c.appendChild(cost);
      c.appendChild(power);
      return c;
    }

    function oppCardEl(card) {
      var c = document.createElement('div');
      c.className = 'card opp' + colorClass(card);
      var power = document.createElement('div');
      power.className = 'power';
      power.textContent = card.power;
      c.appendChild(power);
      return c;
    }

    function renderBoard() {
      var board = document.getElementById('board');
      board.innerHTML = '';
      for (var m = 0; m < MINISTRIES.length; m++) {
        var yp = ministryPower(playerBoard, m);
        var op = ministryPower(oppBoard, m);
        var col = document.createElement('div');
        col.className = 'column min-' + MINISTRIES[m].color;
        col.dataset.ministry = m;

        var oppSlots = document.createElement('div');
        oppSlots.className = 'col-slots';
        for (var s = 0; s < MAX_PER_MINISTRY; s++) {
          var oslot = document.createElement('div');
          oslot.className = 'slot' + (oppBoard[m][s] ? ' filled' : '');
          if (s === 1 && !oppBoard[m][s]) oslot.appendChild(slotHint(m));
          if (oppBoard[m][s]) oslot.appendChild(oppCardEl(oppBoard[m][s]));
          if (s === 1) oslot.appendChild(slotBadge(m, hasBonus(oppBoard, m)));
          oppSlots.appendChild(oslot);
        }
        col.appendChild(oppSlots);

        var head = document.createElement('div');
        head.className = 'col-head' + (yp > op ? ' lead-you' : op > yp ? ' lead-opp' : '');
        head.textContent = MINISTRIES[m].name;
        var tally = document.createElement('span');
        tally.className = 'tally';
        var yb = document.createElement('b'); yb.className = 'you'; yb.textContent = yp;
        var ob = document.createElement('b'); ob.className = 'opp'; ob.textContent = op;
        tally.appendChild(yb);
        tally.appendChild(document.createTextNode(' \u2013 '));
        tally.appendChild(ob);
        head.appendChild(tally);
        col.appendChild(head);

        var playerSlots = document.createElement('div');
        playerSlots.className = 'col-slots';
        for (var q = 0; q < MAX_PER_MINISTRY; q++) {
          var pslot = document.createElement('div');
          pslot.className = 'slot' + (playerBoard[m][q] ? ' filled' : '');
          if (q === 1 && !playerBoard[m][q]) pslot.appendChild(slotHint(m));
          if (playerBoard[m][q]) pslot.appendChild(cardEl(playerBoard[m][q], 'face-up'));
          if (q === 1) pslot.appendChild(slotBadge(m, hasBonus(playerBoard, m)));
          playerSlots.appendChild(pslot);
        }
        col.appendChild(playerSlots);

        board.appendChild(col);
      }
    }

    function renderHand() {
      var el = document.getElementById('player-hand');
      el.innerHTML = '';
      playerHand.forEach(function (card, i) {
        var c = cardEl(card, 'face-up' + (card.cost > playerCoins ? ' cant-afford' : ''));
        c.dataset.handIndex = i;
        el.appendChild(c);
      });
      var strip = document.getElementById('opp-hand-strip');
      strip.innerHTML = '';
      oppHand.forEach(function () {
        var c = document.createElement('div');
        c.className = 'card';
        strip.appendChild(c);
      });
    }

    function render() {
      document.getElementById('turn-counter').textContent =
        gameOver ? 'Game over' : 'Turn ' + turn + ' of ' + MAX_TURNS;
      document.getElementById('opp-wealth').textContent = gameOver ? '' : 'Wealth: ' + oppWealth;
      document.getElementById('opp-coins').textContent = gameOver ? '' : 'Coins: ' + oppCoins;
      document.getElementById('wealth').textContent = gameOver ? '' : 'Wealth: ' + playerWealth;
      document.getElementById('coins').textContent = gameOver ? '' : 'Coins: ' + playerCoins;
      document.getElementById('end-turn').textContent =
        turn === MAX_TURNS && !gameOver ? 'Finish Game' : 'End Turn';
      renderBoard();
      renderHand();
      document.getElementById('player-deck-count').textContent = 'deck: ' + playerDeck.length;
      document.getElementById('opp-deck-count').textContent = 'deck: ' + oppDeck.length;
      document.getElementById('discard-slot').classList.toggle('used', discardUsed);
    }

    function computeResult() {
      var you = 0, opp = 0, youPower = 0, oppPower = 0;
      var detail = [];
      for (var m = 0; m < MINISTRIES.length; m++) {
        var yp = ministryPower(playerBoard, m);
        var op = ministryPower(oppBoard, m);
        youPower += yp; oppPower += op;
        var w = yp > op ? 'you' : op > yp ? 'opp' : 'tie';
        if (w === 'you') you++;
        else if (w === 'opp') opp++;
        detail.push({ name: MINISTRIES[m].name, you: yp, opp: op, winner: w });
      }
      var base = { you: you, opp: opp, detail: detail };
      if (you > opp) return Object.assign({ winner: 'you' }, base);
      if (opp > you) return Object.assign({ winner: 'opp' }, base);
      if (youPower > oppPower) return Object.assign({ winner: 'you', tiebreak: true }, base);
      if (oppPower > youPower) return Object.assign({ winner: 'opp', tiebreak: true }, base);
      return Object.assign({ winner: 'draw' }, base);
    }

    function showResult() {
      var r = computeResult();
      var title = document.getElementById('result-title');
      var sub = document.getElementById('result-sub');
      if (r.winner === 'you') {
        title.textContent = 'Victory!';
        title.className = 'win';
      } else if (r.winner === 'opp') {
        title.textContent = 'Defeat';
        title.className = 'lose';
      } else {
        title.textContent = 'Draw';
        title.className = 'draw';
      }
      sub.innerHTML = '';
      r.detail.forEach(function (d) {
        var row = document.createElement('div');
        row.className = 'mrow';
        var nm = document.createElement('span');
        nm.textContent = d.name;
        var sc = document.createElement('span');
        var yb = document.createElement('b'); yb.className = 'you'; yb.textContent = d.you;
        var ob = document.createElement('b'); ob.className = 'opp'; ob.textContent = d.opp;
        sc.appendChild(yb);
        sc.appendChild(document.createTextNode(' \u2013 '));
        sc.appendChild(ob);
        var mark = document.createElement('span');
        mark.className = 'mark ' + d.winner;
        mark.textContent = d.winner === 'you' ? '\u2713' : d.winner === 'opp' ? '\u2717' : '=';
        row.appendChild(nm);
        row.appendChild(sc);
        row.appendChild(mark);
        sub.appendChild(row);
      });
      if (r.tiebreak) {
        var note = document.createElement('div');
        note.className = 'tnote';
        note.textContent = 'Decided by total power';
        sub.appendChild(note);
      }
      document.getElementById('result-banner').classList.remove('hidden');
    }

    function hasBonus(board, m) { return board[m].length >= 2; }

    function slotBadge(m, on) {
      var b = document.createElement('span');
      b.className = 'slot-badge' + (on ? ' on' : '');
      b.textContent = BONUS_BADGE[m];
      return b;
    }

    function slotHint(m) {
      var h = document.createElement('span');
      h.className = 'slot-hint';
      h.textContent = SLOT_HINT[m];
      return h;
    }

    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { t.classList.add('hidden'); }, 1800);
    }

    function startTurn() {
      // income: wealth grows, coins refill to wealth (no carryover)
      playerWealth += 1 + (hasBonus(playerBoard, 1) ? 1 : 0);
      playerCoins = playerWealth;
      oppWealth += 1 + (hasBonus(oppBoard, 1) ? 1 : 0);
      oppCoins = oppWealth;
      // tax: each militia bonus adds +1; lesser militia power pays
      var tax = (hasBonus(playerBoard, 0) ? 1 : 0) + (hasBonus(oppBoard, 0) ? 1 : 0);
      if (tax > 0) {
        var yp = ministryPower(playerBoard, 0);
        var op = ministryPower(oppBoard, 0);
        if (yp > op) {
          var t1 = Math.min(tax, oppCoins);
          oppCoins -= t1; playerCoins += t1;
          if (t1 > 0) toast('Tax: opponent pays you ' + t1 + ' coin' + (t1 > 1 ? 's' : ''));
        } else if (op > yp) {
          var t2 = Math.min(tax, playerCoins);
          playerCoins -= t2; oppCoins += t2;
          if (t2 > 0) toast('Tax: you pay opponent ' + t2 + ' coin' + (t2 > 1 ? 's' : ''));
        }
      }
      // draw
      var pd = 1 + (hasBonus(playerBoard, 2) ? 1 : 0);
      var od = 1 + (hasBonus(oppBoard, 2) ? 1 : 0);
      for (var i = 0; i < pd; i++) draw(playerDeck, playerHand);
      for (var j = 0; j < od; j++) draw(oppDeck, oppHand);
    }

    function newGame() {
      turn = 1;
      gameOver = false;
      playerWealth = 1; playerCoins = 1; // turn 1: no income phase yet
      oppWealth = 1; oppCoins = 1;
      discardUsed = false;
      playerDeck = buildDeck(); playerHand = [];
      oppDeck = buildDeck(); oppHand = [];
      playerBoard = [[], [], []];
      oppBoard = [[], [], []];
      for (var i = 0; i < STARTING_HAND; i++) {
        draw(playerDeck, playerHand);
        draw(oppDeck, oppHand);
      }
      document.getElementById('result-banner').classList.add('hidden');
      render();
    }

    function validColumns(board, card) {
      var cols = [];
      for (var m = 0; m < MINISTRIES.length; m++) {
        if (board[m].length >= MAX_PER_MINISTRY) continue;
        if (card.ministry !== null && card.ministry !== undefined && card.ministry !== m) continue;
        cols.push(m);
      }
      return cols;
    }

    function opponentPlay() {
      while (true) {
        var affordable = oppHand
          .filter(function (c) { return c.cost <= oppCoins && validColumns(oppBoard, c).length > 0; })
          .sort(function (a, b) { return (b.cost - a.cost) || (b.power - a.power); });
        if (affordable.length === 0) break;
        var card = affordable[0];
        var open = validColumns(oppBoard, card);
        oppHand.splice(oppHand.indexOf(card), 1);
        oppCoins -= card.cost;
        oppBoard[open[Math.floor(Math.random() * open.length)]].push(card);
      }
    }

    // ---- drag & drop (pointer events: touch + mouse) ----
    var drag = null;

    function clearHighlights() {
      document.querySelectorAll('.column.drop-ok, .column.drop-full, #discard-slot.drop-ok').forEach(function (el) {
        el.classList.remove('drop-ok');
        el.classList.remove('drop-full');
      });
    }

    document.addEventListener('pointerdown', function (e) {
      if (gameOver) return;
      var t = e.target.closest('#player-hand .card.face-up');
      if (!t) return;
      var card = playerHand[parseInt(t.dataset.handIndex, 10)];
      if (!card) return;

      var ghost = t.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.left = e.clientX + 'px';
      ghost.style.top = e.clientY + 'px';
      document.body.appendChild(ghost);

      drag = { ghost: ghost, card: card, index: parseInt(t.dataset.handIndex, 10), target: null };
      e.preventDefault();
    });

    document.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      clearHighlights();
      drag.ghost.style.display = 'none';
      var under = document.elementFromPoint(e.clientX, e.clientY);
      drag.ghost.style.display = '';
      var col = under && under.closest ? under.closest('.column') : null;
      var ds = under && under.closest ? under.closest('#discard-slot') : null;
      if (ds) {
        if (!discardUsed) {
          ds.classList.add('drop-ok');
          drag.target = { type: 'discard' };
        } else {
          drag.target = null;
        }
      } else if (col) {
        var m = parseInt(col.dataset.ministry, 10);
        var ok = drag.card.cost <= playerCoins &&
          playerBoard[m].length < MAX_PER_MINISTRY &&
          (drag.card.ministry === null || drag.card.ministry === undefined || drag.card.ministry === m);
        col.classList.add(ok ? 'drop-ok' : 'drop-full');
        drag.target = ok ? { type: 'ministry', m: m } : null;
      } else {
        drag.target = null;
      }
    });

    function endDrag(commit) {
      if (!drag) return;
      if (commit && drag.target) {
        if (drag.target.type === 'discard') {
          playerHand.splice(drag.index, 1);
          playerCoins += 1;
          discardUsed = true;
        } else {
          var pm = drag.target.m;
          playerHand.splice(drag.index, 1);
          playerCoins -= drag.card.cost;
          playerBoard[pm].push(drag.card);
          if (playerBoard[pm].length === 2) toast(BONUS_MSG[pm]);
        }
      }
      drag.ghost.remove();
      drag = null;
      clearHighlights();
      render();
    }

    document.addEventListener('pointerup', function () { endDrag(true); });
    document.addEventListener('pointercancel', function () { endDrag(false); });

    document.getElementById('end-turn').addEventListener('click', function () {
      if (gameOver) return; // restart now lives in the result modal
      opponentPlay();
      if (turn >= MAX_TURNS) {
        gameOver = true;
        render();
        showResult();
      } else {
        turn += 1;
        discardUsed = false;
        startTurn(); // income -> tax -> draw, both players
        render();
      }
    });

    document.getElementById('new-game').addEventListener('click', function () {
      newGame();
    });

    newGame();
  })();
</script>
</body>
</html>
