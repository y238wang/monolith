<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TCG Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0.75rem;
    -webkit-touch-callout: none;
  }
  .zone-label { font-size: 0.8rem; opacity: 0.6; margin-bottom: 0.4rem; }

  /* ---- ministries as columns ---- */
  #board {
    display: flex;
    gap: 8px;
  }
  .column {
    flex: 1;
    min-width: 0;
    background: #22223a;
    border-radius: 10px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .column.drop-ok { outline: 2px solid #4caf50; background: #243024; }
  .column.drop-full { outline: 2px solid #e94560; }
  .col-cards {
    display: flex;
    gap: 4px;
    min-height: 56px;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
  }
  .col-head {
    text-align: center;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 2px;
    border-top: 2px solid #555;
    border-bottom: 2px solid #555;
    opacity: 0.9;
  }
  .col-head.lead-you { border-top-color: #4caf50; border-bottom-color: #4caf50; }
  .col-head.lead-opp { border-top-color: #e94560; border-bottom-color: #e94560; }
  .col-head .tally { display: block; font-size: 0.8rem; margin-top: 2px; text-transform: none; letter-spacing: 0; }
  .col-head .tally b.you { color: #8fd694; }
  .col-head .tally b.opp { color: #f0a0a0; }

  /* ---- cards ---- */
  .card {
    border-radius: 7px;
    border: 2px solid #888;
    flex: 0 0 auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .card .cname {
    position: absolute; top: 2px; left: 0; right: 0;
    text-align: center; font-weight: 700;
    padding: 0 2px; white-space: nowrap; overflow: hidden;
  }
  .card .cost {
    position: absolute; left: 3px;
    border-radius: 50%;
    background: #d4a017; color: #fff;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .card .power {
    position: absolute; bottom: 1px; left: 0; right: 0;
    text-align: center; font-weight: 800;
  }
  /* hand cards (large) */
  .hand .card { width: 56px; height: 78px; font-size: 9px; }
  .hand .card .cname { font-size: 7px; }
  .hand .card .cost { top: 13px; width: 18px; height: 18px; font-size: 11px; }
  .hand .card .power { font-size: 20px; }
  .card.face-up { background: #f0e6d2; color: #222; cursor: grab; }
  .card.face-up.cant-afford { opacity: 0.35; cursor: default; }
  /* column cards (compact) */
  .col-cards .card { width: 38px; height: 54px; }
  .col-cards .card .cname { font-size: 6px; }
  .col-cards .card .cost { top: 10px; width: 14px; height: 14px; font-size: 9px; }
  .col-cards .card .power { font-size: 15px; }
  .col-cards .card.face-up { cursor: default; }
  .col-cards .card.opp { background: #3a3a5e; border-color: #555; cursor: default; }
  .col-cards .card.opp .power { color: #bbb; }
  .card.drag-ghost {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    opacity: 0.92;
    transform: translate(-50%, -50%) scale(1.08);
    margin: 0;
  }

  .hand {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 84px;
    align-content: flex-start;
  }
  #opp-hand-strip { display: flex; gap: 4px; margin-bottom: 0.5rem; }
  #opp-hand-strip .card { width: 30px; height: 42px; border-radius: 5px; background: #3a3a5e; border-color: #555; }

  #table {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 0.7rem 0;
  }
  #turn-counter { font-size: 1.3rem; font-weight: 700; }
  #coins { font-size: 1rem; font-weight: 600; color: #ffd75e; }
  #end-turn {
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 999px;
    background: #e94560;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #end-turn:active { transform: scale(0.97); }
  #player-zone { margin-top: auto; }

  #result-banner {
    position: fixed; inset: 0;
    background: rgba(10, 10, 20, 0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.75rem; z-index: 2000;
  }
  #result-banner.hidden { display: none; }
  #result-title { font-size: 2.5rem; font-weight: 800; }
  #result-title.win { color: #8fd694; }
  #result-title.lose { color: #f0a0a0; }
  #result-title.draw { color: #ccc; }
  #result-sub { font-size: 1.1rem; opacity: 0.8; }
</style>
</head>
<body oncontextmenu="return false">
  <section id="opp-zone">
    <div class="zone-label">Opponent &middot; <span id="opp-deck-count"></span></div>
    <div id="opp-hand-strip"></div>
  </section>

  <section id="board"></section>

  <section id="table">
    <div>
      <p id="turn-counter">Turn 1 of 6</p>
      <p id="coins"></p>
    </div>
    <button id="end-turn" type="button">End Turn</button>
  </section>

  <section id="player-zone">
    <div class="zone-label">Your hand &middot; <span id="player-deck-count"></span></div>
    <div class="hand" id="player-hand"></div>
  </section>

  <div id="result-banner" class="hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
  </div>

<script>
  (function () {
    var MAX_TURNS = 6;
    var STARTING_HAND = 4;
    var MINISTRIES = ['Military', 'Treasury', 'Intel'];
    var MAX_PER_MINISTRY = 3;

    var STARTER = [
      { name: 'Conscript',   cost: 1, power: 2,  count: 3 },
      { name: 'Soldier',     cost: 2, power: 4,  count: 3 },
      { name: 'Veteran',      cost: 3, power: 6,  count: 3 },
      { name: 'Elite Guard', cost: 4, power: 9,  count: 2 },
      { name: 'General',      cost: 5, power: 11, count: 2 },
      { name: 'Warlord',      cost: 6, power: 14, count: 2 }
    ];

    var turn, gameOver, playerCoins;
    var playerDeck, playerHand, oppDeck, oppHand;
    var playerBoard, oppBoard; // [ministry] -> array of cards (max 3)
    var nextId = 1;

    function buildDeck() {
      var d = [];
      STARTER.forEach(function (t) {
        for (var i = 0; i < t.count; i++) {
          d.push({ id: nextId++, name: t.name, cost: t.cost, power: t.power });
        }
      });
      for (var j = d.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = d[j]; d[j] = d[k]; d[k] = tmp;
      }
      return d;
    }

    function draw(deck, hand) {
      if (deck.length > 0) hand.push(deck.pop());
    }

    function ministryPower(board, m) {
      var t = 0;
      board[m].forEach(function (c) { t += c.power; });
      return t;
    }

    function cardEl(card, cls) {
      var c = document.createElement('div');
      c.className = 'card ' + cls;
      c.dataset.cardId = card.id;
      var name = document.createElement('div');
      name.className = 'cname';
      name.textContent = card.name;
      var cost = document.createElement('div');
      cost.className = 'cost';
      cost.textContent = card.cost;
      var power = document.createElement('div');
      power.className = 'power';
      power.textContent = card.power;
      c.appendChild(name);
      c.appendChild(cost);
      c.appendChild(power);
      return c;
    }

    function oppCardEl(card) {
      var c = document.createElement('div');
      c.className = 'card opp';
      var power = document.createElement('div');
      power.className = 'power';
      power.textContent = card.power;
      c.appendChild(power);
      return c;
    }

    function renderBoard() {
      var board = document.getElementById('board');
      board.innerHTML = '';
      for (var m = 0; m < MINISTRIES.length; m++) {
        var yp = ministryPower(playerBoard, m);
        var op = ministryPower(oppBoard, m);
        var col = document.createElement('div');
        col.className = 'column';
        col.dataset.ministry = m;

        var oppRow = document.createElement('div');
        oppRow.className = 'col-cards';
        oppBoard[m].forEach(function (card) { oppRow.appendChild(oppCardEl(card)); });
        col.appendChild(oppRow);

        var head = document.createElement('div');
        head.className = 'col-head' + (yp > op ? ' lead-you' : op > yp ? ' lead-opp' : '');
        head.textContent = MINISTRIES[m];
        var tally = document.createElement('span');
        tally.className = 'tally';
        var yb = document.createElement('b'); yb.className = 'you'; yb.textContent = yp;
        var ob = document.createElement('b'); ob.className = 'opp'; ob.textContent = op;
        tally.appendChild(yb);
        tally.appendChild(document.createTextNode(' \u2013 '));
        tally.appendChild(ob);
        head.appendChild(tally);
        col.appendChild(head);

        var playerRow = document.createElement('div');
        playerRow.className = 'col-cards';
        playerBoard[m].forEach(function (card) { playerRow.appendChild(cardEl(card, 'face-up')); });
        col.appendChild(playerRow);

        board.appendChild(col);
      }
    }

    function renderHand() {
      var el = document.getElementById('player-hand');
      el.innerHTML = '';
      playerHand.forEach(function (card, i) {
        var c = cardEl(card, 'face-up' + (card.cost > playerCoins ? ' cant-afford' : ''));
        c.dataset.handIndex = i;
        el.appendChild(c);
      });
      var strip = document.getElementById('opp-hand-strip');
      strip.innerHTML = '';
      oppHand.forEach(function () {
        var c = document.createElement('div');
        c.className = 'card';
        strip.appendChild(c);
      });
    }

    function render() {
      document.getElementById('turn-counter').textContent =
        gameOver ? 'Game over' : 'Turn ' + turn + ' of ' + MAX_TURNS;
      document.getElementById('coins').textContent = gameOver ? '' : 'Coins: ' + playerCoins;
      document.getElementById('end-turn').textContent =
        gameOver ? 'New Game' : (turn === MAX_TURNS ? 'Finish Game' : 'End Turn');
      renderBoard();
      renderHand();
      document.getElementById('player-deck-count').textContent = 'deck: ' + playerDeck.length;
      document.getElementById('opp-deck-count').textContent = 'deck: ' + oppDeck.length;
    }

    function computeResult() {
      var you = 0, opp = 0, youPower = 0, oppPower = 0;
      for (var m = 0; m < MINISTRIES.length; m++) {
        var yp = ministryPower(playerBoard, m);
        var op = ministryPower(oppBoard, m);
        youPower += yp; oppPower += op;
        if (yp > op) you++;
        else if (op > yp) opp++;
      }
      if (you > opp) return { winner: 'you', you: you, opp: opp };
      if (opp > you) return { winner: 'opp', you: you, opp: opp };
      if (youPower > oppPower) return { winner: 'you', you: you, opp: opp, tiebreak: true };
      if (oppPower > youPower) return { winner: 'opp', you: you, opp: opp, tiebreak: true };
      return { winner: 'draw', you: you, opp: opp };
    }

    function showResult() {
      var r = computeResult();
      var title = document.getElementById('result-title');
      var sub = document.getElementById('result-sub');
      if (r.winner === 'you') {
        title.textContent = 'Victory!';
        title.className = 'win';
      } else if (r.winner === 'opp') {
        title.textContent = 'Defeat';
        title.className = 'lose';
      } else {
        title.textContent = 'Draw';
        title.className = 'draw';
      }
      sub.textContent = 'Ministries ' + r.you + ' \u2013 ' + r.opp +
        (r.tiebreak ? ' (total power tiebreak)' : '');
      document.getElementById('result-banner').classList.remove('hidden');
    }

    function newGame() {
      turn = 1;
      gameOver = false;
      playerCoins = 1; // turn-number income, no carryover
      playerDeck = buildDeck(); playerHand = [];
      oppDeck = buildDeck(); oppHand = [];
      playerBoard = [[], [], []];
      oppBoard = [[], [], []];
      for (var i = 0; i < STARTING_HAND; i++) {
        draw(playerDeck, playerHand);
        draw(oppDeck, oppHand);
      }
      document.getElementById('result-banner').classList.add('hidden');
      render();
    }

    function opponentPlay() {
      var coins = turn; // same income rule as the player
      while (true) {
        var openCols = [];
        for (var m = 0; m < MINISTRIES.length; m++)
          if (oppBoard[m].length < MAX_PER_MINISTRY) openCols.push(m);
        if (openCols.length === 0) break;
        var affordable = oppHand.filter(function (c) { return c.cost <= coins; });
        if (affordable.length === 0) break;
        affordable.sort(function (a, b) { return (b.cost - a.cost) || (b.power - a.power); });
        var card = affordable[0];
        oppHand.splice(oppHand.indexOf(card), 1);
        coins -= card.cost;
        var col = openCols[Math.floor(Math.random() * openCols.length)];
        oppBoard[col].push(card);
      }
    }

    // ---- drag & drop (pointer events: touch + mouse) ----
    var drag = null;

    function clearHighlights() {
      document.querySelectorAll('.column.drop-ok, .column.drop-full').forEach(function (el) {
        el.classList.remove('drop-ok');
        el.classList.remove('drop-full');
      });
    }

    document.addEventListener('pointerdown', function (e) {
      if (gameOver) return;
      var t = e.target.closest('#player-hand .card.face-up');
      if (!t || t.classList.contains('cant-afford')) return;
      var card = playerHand[parseInt(t.dataset.handIndex, 10)];
      if (!card || card.cost > playerCoins) return;

      var ghost = t.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.left = e.clientX + 'px';
      ghost.style.top = e.clientY + 'px';
      document.body.appendChild(ghost);

      drag = { ghost: ghost, card: card, index: parseInt(t.dataset.handIndex, 10), target: null };
      e.preventDefault();
    });

    document.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      clearHighlights();
      drag.ghost.style.display = 'none';
      var under = document.elementFromPoint(e.clientX, e.clientY);
      drag.ghost.style.display = '';
      var col = under && under.closest ? under.closest('.column') : null;
      if (col) {
        var m = parseInt(col.dataset.ministry, 10);
        if (playerBoard[m].length < MAX_PER_MINISTRY) {
          col.classList.add('drop-ok');
          drag.target = m;
        } else {
          col.classList.add('drop-full');
          drag.target = null;
        }
      } else {
        drag.target = null;
      }
    });

    function endDrag(commit) {
      if (!drag) return;
      if (commit && drag.target !== null) {
        playerHand.splice(drag.index, 1);
        playerCoins -= drag.card.cost;
        playerBoard[drag.target].push(drag.card);
      }
      drag.ghost.remove();
      drag = null;
      clearHighlights();
      render();
    }

    document.addEventListener('pointerup', function () { endDrag(true); });
    document.addEventListener('pointercancel', function () { endDrag(false); });

    document.getElementById('end-turn').addEventListener('click', function () {
      if (gameOver) {
        newGame();
        return;
      }
      opponentPlay();
      if (turn >= MAX_TURNS) {
        gameOver = true;
        render();
        showResult();
      } else {
        turn += 1;
        playerCoins = turn; // income = turn number, no carryover
        draw(playerDeck, playerHand);
        draw(oppDeck, oppHand);
        render();
      }
    });

    newGame();
  })();
</script>
</body>
</html>
