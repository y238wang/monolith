<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TCG Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 1rem;
  }
  .zone-label { font-size: 0.8rem; opacity: 0.6; margin-bottom: 0.5rem; }
  .hand {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 82px;
    align-content: flex-start;
  }
  .card {
    width: 54px;
    height: 76px;
    border-radius: 8px;
    border: 2px solid #888;
    flex: 0 0 auto;
  }
  .card.face-up { background: #f0e6d2; }
  .card.face-down { background: #2e2e4e; border-color: #555; }
  #table {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1rem 0;
  }
  #turn-counter { font-size: 2rem; font-weight: 700; }
  #end-turn {
    font-size: 1.25rem;
    font-weight: 600;
    padding: 1rem 3rem;
    border: none;
    border-radius: 999px;
    background: #e94560;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #end-turn:active { transform: scale(0.97); }
  #player-zone { margin-top: auto; }
</style>
</head>
<body>
  <section id="opponent-zone">
    <div class="zone-label">Opponent &middot; <span id="opp-deck-count"></span></div>
    <div class="hand" id="opp-hand"></div>
  </section>

  <section id="table">
    <p id="turn-counter">Turn 1 of 6</p>
    <button id="end-turn" type="button">End Turn</button>
  </section>

  <section id="player-zone">
    <div class="zone-label">You &middot; <span id="player-deck-count"></span></div>
    <div class="hand" id="player-hand"></div>
  </section>

<script>
  (function () {
    var MAX_TURNS = 6;
    var STARTING_HAND = 4;
    var DECK_SIZE = 15;

    var turn, gameOver;
    var playerDeck, playerHand, oppDeck, oppHand;

    function newDeck() {
      var d = [];
      for (var i = 0; i < DECK_SIZE; i++) d.push({ id: i });
      for (var j = d.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var t = d[j]; d[j] = d[k]; d[k] = t;
      }
      return d;
    }

    function draw(deck, hand) {
      if (deck.length > 0) hand.push(deck.pop());
    }

    function renderHand(elId, hand, faceUp) {
      var el = document.getElementById(elId);
      el.innerHTML = '';
      hand.forEach(function () {
        var c = document.createElement('div');
        c.className = 'card ' + (faceUp ? 'face-up' : 'face-down');
        el.appendChild(c);
      });
    }

    function render() {
      document.getElementById('turn-counter').textContent =
        gameOver ? 'Game over' : 'Turn ' + turn + ' of ' + MAX_TURNS;
      document.getElementById('end-turn').textContent =
        gameOver ? 'New Game' : (turn === MAX_TURNS ? 'Finish Game' : 'End Turn');
      renderHand('player-hand', playerHand, true);
      renderHand('opp-hand', oppHand, false);
      document.getElementById('player-deck-count').textContent = 'deck: ' + playerDeck.length;
      document.getElementById('opp-deck-count').textContent = 'deck: ' + oppDeck.length;
    }

    function newGame() {
      turn = 1;
      gameOver = false;
      playerDeck = newDeck(); playerHand = [];
      oppDeck = newDeck(); oppHand = [];
      for (var i = 0; i < STARTING_HAND; i++) {
        draw(playerDeck, playerHand);
        draw(oppDeck, oppHand);
      }
      render();
    }

    document.getElementById('end-turn').addEventListener('click', function () {
      if (gameOver) {
        newGame();
        return;
      }
      if (turn >= MAX_TURNS) {
        gameOver = true;
      } else {
        turn += 1;
        draw(playerDeck, playerHand);
        draw(oppDeck, oppHand);
      }
      render();
    });

    newGame();
  })();
</script>
</body>
</html>
